function coachAdvice(p){
  if(p.name==='Ernesto'&&!(s.coachSessions&&s.coachSessions.Ernesto))return 'Ernesto: "You want free advice? Train with me first. Until then, watch and try to keep up."';
  const pool=[...(coachWisdom[p.name]||[]),...(extraCoachLines[p.name]||[])];
  const coachNumber={'Coach Mike':0,'Zaid':1,'Jacob':2,'Ernesto':3}[p.name]||0;
  // Different advice each consecutive in-game day, with a long non-repeating cycle.
  const cycle=Math.floor((s.day-1)/pool.length),index=(s.day-1)%pool.length;
  const step=cycle%2===0?1:5;
  const offset=(cycle*7+coachNumber*3)%pool.length;
  const line=pool[(offset+index*step)%pool.length];
  return p.name+': "'+line.replaceAll('{STA}',String(s.stamina)).replaceAll('{HY}',String(s.hygiene)).replaceAll('{SP}',String(s.sp)).replaceAll('{GUARD}',String(s.stats[4])).replaceAll('{ESC}',String(s.stats[5])).replaceAll('{STANDING}',String(s.stats[6])).replaceAll('{STR}',String(s.stats[0])).replaceAll('{SCRAMBLE}',String(s.stats[3]))+'"';
}
